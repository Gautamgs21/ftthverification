<style>
:root{--n:#1a2b45;--g:#8b734b;--b:#f3ede4;--bg:#f1f5f9;--bd:#cbd5e1}
*{box-sizing:border-box}[hidden]{display:none!important}

.w{padding:0 12px}

.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid var(--n);flex-wrap:wrap}

.nc i{font-size:26px}.nc span{font-size:11px;font-weight:700;letter-spacing:.3px}
.nc.on{background:var(--b);border:2px solid var(--n)}
.acts{display:flex;flex-direction:column;gap:8px;min-width:210px}
.btn{padding:9px 14px;border-radius:4px;border:1px solid var(--n);font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--n);text-transform:uppercase}
.btn.p{background:var(--n);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.sm{font-family:'Segoe UI',sans-serif;text-transform:none;font-weight:600;padding:7px 11px}
main{margin:12px 0;padding:0 12px}
.pn{background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 1px 3px #0001;margin-bottom:14px}
.pn:fullscreen{overflow:auto;border-radius:0;margin:0}.pn:fullscreen .tw{max-height:calc(100vh - 170px)}
.ph{padding:14px 16px;border-bottom:1px solid var(--bd)}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph small{color:var(--g);font-weight:700;letter-spacing:1px;font-size:12px}.ph h2{margin:2px 0 0;font-size:clamp(20px,4vw,28px)}

.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}

.tbtn,.zg{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--n);font:600 13px 'Segoe UI',sans-serif;cursor:pointer}
.tbtn:disabled{opacity:.45;cursor:not-allowed}.zg{padding:0}.zg button{border:0;background:none;color:var(--n);height:100%;padding:0 10px;cursor:pointer;font:inherit}.zg span{font-size:12px;padding:0 4px}

.pop{position:absolute;top:calc(100% + 9px);left:0;background:#fff;border:1px solid var(--bd);border-radius:6px;box-shadow:0 6px 18px #0003;padding:10px;z-index:15;min-width:250px;max-height:320px;overflow:auto;display:none}
.pop.show{display:block}.pop:before{content:'';position:absolute;top:-6px;left:22px;width:10px;height:10px;background:#fff;border-left:1px solid var(--bd);border-top:1px solid var(--bd);transform:rotate(45deg)}

select.tbtn{padding:0 8px}
.tw{overflow:auto;max-height:65vh}
table{border-collapse:collapse;width:max-content;min-width:100%}
th{position:sticky;top:0;background:var(--n);color:#fff;padding:8px 10px;text-align:left;font-size:12px;white-space:nowrap;cursor:pointer;z-index:2}
th i{font-size:9px;opacity:.6;margin-left:4px}
td{padding:7px 10px;border-bottom:1px solid #e2e8f0;font-size:13px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none}
tr:nth-child(even) td{background:#f8fafc}td:focus{outline:2px solid var(--g);background:#fff!important;user-select:text}
tr.vis td{background:#f0fbf3!important}tr.vis td:first-child{box-shadow:inset 4px 0 #4ade80}
.ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;font-size:13px}
.pg button{border:1px solid var(--bd);background:#fff;padding:5px 10px;margin:0 2px;border-radius:4px;cursor:pointer;color:var(--n)}.pg button.on{background:var(--n);color:#fff}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.show{display:flex}#lg{background:var(--bg);z-index:80}
.md{background:#fff;border-radius:8px;width:460px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 40px #0005}
.md .ml{overflow:auto;padding:10px 16px}.md h3{margin:0;padding:14px 44px 14px 16px;border-bottom:1px solid var(--bd);font-family:Merriweather,serif}.md .mf{padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}
.x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--n)}
.lb{display:block;margin:12px 0 4px;font-size:12px;color:var(--g);letter-spacing:.5px}.cg{display:grid;grid-template-columns:1fr;max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:4px;padding:4px 8px}
.rd label{display:inline-flex;gap:5px;margin-right:16px;align-items:center}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.fl b{font-size:12px;color:var(--g)}.fc{display:flex;flex-direction:column;gap:4px;flex:1 1 150px}.fc select{width:100%}
.cv{width:100%;height:clamp(300px,calc(100vh - 360px),640px)}

.row>label{font-weight:600;font-size:13px}.o{display:inline-flex;gap:5px;margin:2px 14px 2px 0;align-items:center;font-weight:400}
.row input[type=text],.row input[type=password],.row input[type=date],.row textarea{width:100%}.ro{background:#f8fafc;padding:7px 9px;border:1px dashed var(--bd);border-radius:4px;min-height:34px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.dg label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600}.dg input{width:100%}
.empty{padding:30px;text-align:center;color:#64748b}
.vc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs .btn.p{background:var(--n)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:6px;display:none;z-index:90}

#cm div{padding:10px 14px;cursor:pointer;font-size:13px}#cm div:hover{background:var(--b)}
.lc{width:360px;max-width:100%;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:26px;box-shadow:0 6px 24px #0002}
.lc h1{margin:0 0 4px;font-size:26px}.lc p{margin:0 0 16px;color:var(--g);font-size:12px;letter-spacing:1px}.lc input{width:100%;margin-bottom:10px}
.view{display:none}.view.on{display:block}
@media(max-width:700px){.nc{width:calc(33.3% - 10px);min-width:90px;height:78px}.cards{gap:10px;flex:1 1 100%}.acts{flex-direction:row;flex:1 1 100%}.acts .btn{flex:1}.row{grid-template-columns:1fr}.tb .sp{margin-left:0}}
</style></head><body>
<div class="ov show" id="lg"><form class="lc" id="lf"><h1>FTTH Verification</h1><p>SIGN IN</p>
<input type="text" id="lu" placeholder="Username" autocomplete="username"><input type="password" id="lp" placeholder="Password" autocomplete="current-password">
<div id="le" style="color:#b91c1c;min-height:18px;font-size:13px"></div><button class="btn p" style="width:100%;margin-top:6px" type="submit">Login</button></form></div>
<div id="app" hidden>
<header><div class="w">
<div class="top"><h1>FTTH Verification</h1><button class="sq" id="fs" title="Full screen"><i class="fa-solid fa-expand"></i></button></div>
<div class="bar"><div class="cards" id="cards"></div>
<div class="acts"><button class="btn p" id="ins">Update DB</button><button class="btn" id="dl" disabled>Download DB</button><input type="file" id="file" accept=".csv,.xlsx,.xls" hidden></div></div></div></header>
<main><section class="view" id="v-dash"></section><section class="view" id="v-db"></section><section class="view" id="v-visits"></section><section class="view" id="v-pro"></section><section class="view" id="v-set"></section></main></div>
<div class="ov" id="dm"><div class="md"><button class="x" id="dx" title="Close">&times;</button><h3>Download DB</h3><div class="ml">
<b class="lb">DEFAULT DOWNLOAD LIST</b><div class="rd"><label><input type="radio" name="dlist" value="All" checked>All</label><label><input type="radio" name="dlist" value="Visited">Visited</label><label><input type="radio" name="dlist" value="Unvisited">Unvisited</label></div>
<b class="lb">SELECT COLUMNS <a href="#" id="dall" style="float:right;color:var(--n)">Select / clear all</a></b><div class="cg" id="dcols"></div>
<b class="lb">SAVE AS</b><div class="rd"><label><input type="radio" name="dfmt" value="PDF">PDF</label><label><input type="radio" name="dfmt" value="CSV" checked>CSV</label></div>
</div><div class="mf"><button class="btn p" id="dok">Download</button></div></div></div>
<div id="cm"></div><div id="toast"></div>
<script>
const COLS=["S.No.","Name of the State/UT","Circle name","District name","Block name","Block code","GP name","GP code","Village name","Village code","Village poulation range","Name of BNU","BNU Mobile number","BNU unique id","OLT IP from which ONT of the customer connected","Name of the customer","Customer unique id","Type of Customer (Publicinstitution/PrivateEnterprise/Household)","Customer address","ONT MAC address","Latitude of FTTH connection","Longitude of FTTH connection","Date of activation of connection","Current FTTH connection status (Active/Permanently closed)","If active Connection age at the last day of reporting quarter","Data usage of the Customer (GB)","Permanently closed, then Date of permanently closed"];
const FL=[['State','Name of the State/UT'],['Circle','Circle name'],['District','District name'],['Block','Block name'],['GP','GP name'],['Village','Village name']];
const PAGES=[['dash','Dashboard','fa-gauge-high'],['db','Edit DB','fa-database'],['visits','My Visits','fa-chart-simple'],['pro','Proforma','fa-file-lines'],['set','Settings','fa-gear']];
const TITLES={dash:'Dashboard',db:'Edit DB',visits:'My Visits',pro:'Proforma',set:'Settings'};
let DB=[],VIS={},VST={},SCH=[],cur='dash',chart=null,cp=null;
const mk=()=>({page:1,rows:25,col:null,dir:1,zoom:100,list:'All',hidden:new Set(),sel:new Set()});
const ST={db:mk(),plan:mk(),view:mk()};
const S={f:['','','','','',''],vf:['','','','','',''],pf:['','','','','',''],pd:false,vtab:'up',vs:null,pdate:'',pname:'',draft:{}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const toast=m=>{const t=$('toast');(document.fullscreenElement||document.body).appendChild(t);t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2400)};
const vis=r=>!!VST[r[COLS[0]]],idx=n=>DB.findIndex(r=>String(r[COLS[0]])==String(n));
/* ---------- storage + MongoDB API ---------- */
const cfg=()=>JSON.parse(localStorage.getItem('ftth_cfg')||'{}');
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('ftth',2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('k'))q.result.createObjectStore('k')};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const payload=()=>({records:DB,visits:VIS,status:VST,schedules:SCH});
async function saveLocal(){try{const d=await idb();d&&d.transaction('k','readwrite').objectStore('k').put(payload(),'s')}catch(e){}}
async function loadLocal(){const d=await idb();if(!d)return;await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>{const v=q.result;if(v){DB=v.records||[];VIS=v.visits||{};VST=v.status||{};SCH=v.schedules||[]}r()};q.onerror=r})}
const hdr=c=>({'Content-Type':'application/json',...(c.key?{Authorization:'Bearer '+c.key}:{})});
async function pull(){const c=cfg();if(!c.api)return;try{const r=await fetch(c.api.replace(/\/$/,'')+'/data',{headers:hdr(c)});if(!r.ok)throw 0;const d=await r.json();DB=d.records||[];VIS=d.visits||{};VST=d.status||{};SCH=d.schedules||[];await saveLocal();toast('Loaded from MongoDB')}catch(e){toast('Database unreachable – using local copy')}}
let ptm;function save(){saveLocal();const c=cfg();if(!c.api)return;clearTimeout(ptm);ptm=setTimeout(()=>fetch(c.api.replace(/\/$/,'')+'/data',{method:'PUT',headers:hdr(c),body:JSON.stringify(payload())}).catch(()=>toast('Sync to MongoDB failed')),1500)}
/* ---------- login ---------- */
const hash=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}};
const getUsers=async()=>{let u=JSON.parse(localStorage.getItem('ftth_users')||'null');if(!u){const o=JSON.parse(localStorage.getItem('ftth_acct')||'null');u=[o||{u:'admin',h:await hash('admin123')}];putUsers(u)}return u};
const putUsers=u=>localStorage.setItem('ftth_users',JSON.stringify(u));
$('lf').onsubmit=async e=>{e.preventDefault();const us=await getUsers(),n=$('lu').value.trim(),h=await hash($('lp').value);if(us.some(x=>x.u==n&&x.h==h)){sessionStorage.setItem('ftth_in','1');sessionStorage.setItem('ftth_user',n);$('lp').value='';$('le').textContent='';enter()}else $('le').textContent='Invalid username or password'};
async function enter(){$('lg').classList.remove('show');$('app').hidden=false;await pull();go('dash')}
/* ---------- nav ---------- */
$('cards').innerHTML=PAGES.map(p=>`<button class="nc" data-p="${p[0]}"><i class="fa-solid ${p[2]}"></i><span>${p[1].toUpperCase()}</span></button>`).join('');
$('cards').onclick=e=>{const b=e.target.closest('.nc');if(!b)return;if(b.dataset.p=='pro'){cp=null;S.draft={}}go(b.dataset.p)};
const head=x=>`<div class="ph hd"><div><small>FTTH VERIFICATION</small><h2>${TITLES[cur]}</h2></div>${x||''}</div>`;
function go(p){cur=p;document.querySelectorAll('.nc').forEach(b=>b.classList.toggle('on',b.dataset.p==p));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id=='v-'+p));
({dash:rDash,db:rDB,visits:rVisits,pro:rPro,set:rSet})[p]();$('dl').disabled=!DB.length}
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
document.addEventListener('fullscreenchange',()=>document.querySelectorAll('.pn').forEach(h=>h._draw&&h._draw()));
document.addEventListener('click',()=>{document.querySelectorAll('.pop').forEach(p=>p.classList.remove('show'));$('cm').style.display='none'});
/* ---------- Update DB (CSV, skip duplicates) ---------- */
$('ins').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
if(!rows.length)return toast('File is empty');if(!('Customer unique id' in rows[0]))return toast('Columns do not match the DB format');
const key=r=>String(r['Customer unique id']||'').trim()||JSON.stringify(COLS.slice(1).map(c=>r[c]));
const seen=new Set(DB.map(key)),used=new Set(DB.map(r=>String(r[COLS[0]])));let max=DB.reduce((m,r)=>Math.max(m,+r[COLS[0]]||0),0),add=0,skip=0;
rows.forEach(r=>{const k=key(r);if(seen.has(k)){skip++;return}seen.add(k);const o={};COLS.forEach(c=>o[c]=r[c]??'');let s=String(o[COLS[0]]).trim();if(!s||used.has(s))s=String(++max);else max=Math.max(max,+s||max);o[COLS[0]]=s;used.add(s);DB.push(o);add++});
save();go(cur);toast(`${add} added, ${skip} duplicate${skip==1?'':'s'} skipped`)}catch(x){toast('Could not read file')}};
/* ---------- Download DB popup ---------- */
const saveBlob=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
$('dl').onclick=()=>{$('dcols').innerHTML=COLS.map(c=>`<label><input type="checkbox" value="${esc(c)}" checked>${esc(c)}</label>`).join('');$('dm').classList.add('show')};
$('dx').onclick=()=>$('dm').classList.remove('show');$('dm').onclick=e=>{if(e.target.id=='dm')$('dm').classList.remove('show')};
$('dall').onclick=e=>{e.preventDefault();const b=$('dcols').querySelectorAll('input'),a=[...b].every(x=>x.checked);b.forEach(x=>x.checked=!a)};
$('dok').onclick=()=>{const L=document.querySelector('[name=dlist]:checked').value,F=document.querySelector('[name=dfmt]:checked').value,cols=[...$('dcols').querySelectorAll('input:checked')].map(b=>b.value);
if(!cols.length)return toast('Select at least one column');const rs=DB.filter(r=>L=='All'||(L=='Visited')==vis(r)),nm='FTTH_DB_'+L+'_'+today();
if(F=='CSV'){const csv=XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(rs.map(r=>Object.fromEntries(cols.map(c=>[c,r[c]]))),{header:cols}));saveBlob(new Blob(['\ufeff'+csv],{type:'text/csv'}),nm+'.csv')}
else{const doc=new jspdf.jsPDF({orientation:'l',unit:'pt',format:cols.length>10?'a3':'a4'});doc.text('FTTH Verification – '+L+' ('+rs.length+')',30,28);doc.autoTable({startY:40,head:[cols],body:rs.map(r=>cols.map(c=>String(r[c]??''))),styles:{fontSize:6,cellPadding:2},headStyles:{fillColor:[26,43,69]}});doc.save(nm+'.pdf')}
$('dm').classList.remove('show')};
/* ---------- filters (as on Dashboard) ---------- */
function fbar(f){let ix=DB.map((r,i)=>i);const html=FL.map(([n,c],i)=>{const op=[...new Set(ix.map(k=>DB[k][c]).filter(x=>x!==''))].sort();if(f[i]&&!op.includes(f[i]))f[i]='';
const h=`<div class="fc"><b>SELECT ${n.toUpperCase()}</b><select data-l="${i}"><option value="">All</option>${op.map(x=>`<option ${x==f[i]?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;if(f[i])ix=ix.filter(k=>DB[k][c]==f[i]);return h}).join('');return{html,ix}}
function fbind(f,h,cb){h.querySelectorAll('.fc select').forEach(el=>el.onchange=()=>{const i=+el.dataset.l;f[i]=el.value;for(let j=i+1;j<6;j++)f[j]='';cb()})}
/* ---------- dashboard ---------- */
function rDash(){const fb=fbar(S.f),rs=fb.ix.map(i=>DB[i]),v=rs.filter(vis).length;
$('v-dash').innerHTML=`<div class="pn">${head()}<div class="pb"><div class="fl">${fb.html}</div><div class="cv" style="margin-top:16px"><canvas id="ch"></canvas></div></div></div>`;
fbind(S.f,$('v-dash'),rDash);chart&&chart.destroy();chart=new Chart($('ch'),{type:'bar',data:{labels:['Total Records','Visited','Pending'],datasets:[{data:[rs.length,v,rs.length-v],backgroundColor:['#1a2b45','#2f855a','#8b734b']}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}
/* ---------- reusable table (Edit DB / planner / visit list) ---------- */
function setV(n,v){v?VST[n]=today():delete VST[n];save();toast(v?'Added to Visited':'Added to Non Visited')}
function openRec(n){S.draft={};cp=idx(n);go('pro')}
function T(host,st,base,o={}){
const draw=()=>{let a=base();if(st.list=='Visited')a=a.filter(i=>vis(DB[i]));else if(st.list=='Unvisited')a=a.filter(i=>!vis(DB[i]));
if(st.col!=null)a.sort((x,y)=>st.dir*String(DB[x][st.col]).localeCompare(String(DB[y][st.col]),undefined,{numeric:true}));
const tp=Math.max(1,Math.ceil(a.length/st.rows));st.page=Math.min(st.page,tp);const s0=(st.page-1)*st.rows,pg=a.slice(s0,s0+st.rows),vc=COLS.filter(c=>!st.hidden.has(c)),fs=document.fullscreenElement==host,sa=pg.length&&pg.every(i=>st.sel.has(String(DB[i][COLS[0]])));

let rn=0;
function fld(l,ty,op,v,ro){let c;v=v??'';

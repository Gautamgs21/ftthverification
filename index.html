<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTTH Verification</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--n:#1a2b45;--g:#8b734b;--b:#f3ede4;--bg:#f1f5f9;--bd:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--n);font:14px 'Segoe UI',system-ui,sans-serif}
.serif,h1,h2,.nc span,.btn{font-family:Merriweather,Georgia,serif}
header{position:sticky;top:0;z-index:20;background:#f1efe9;border-bottom:0}
.w{max-width:1400px;margin:0 auto;padding:0 14px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;border-bottom:2px solid var(--n)}
.top h1{margin:0;font-size:clamp(20px,4vw,30px)}
.sq{width:36px;height:36px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--n);cursor:pointer}
.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid var(--n);flex-wrap:wrap}
.cards{display:flex;gap:14px;flex-wrap:wrap}
.nc{width:112px;height:92px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--n);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.nc i{font-size:26px}.nc span{font-size:11px;font-weight:700;letter-spacing:.3px}
.nc.on{background:var(--b);border:2px solid var(--n)}
.acts{display:flex;flex-direction:column;gap:8px;min-width:210px}
.btn{padding:9px 14px;border-radius:4px;border:1px solid var(--n);font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--n);text-transform:uppercase}
.btn.p{background:var(--n);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.sm{font-family:'Segoe UI',sans-serif;text-transform:none;font-weight:600;padding:7px 11px}
main{max-width:1400px;margin:14px auto;padding:0 14px}
.pn{background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 1px 3px #0001;margin-bottom:14px}
.ph{padding:14px 16px;border-bottom:1px solid var(--bd)}
.ph small{color:var(--g);font-weight:700;letter-spacing:1px;font-size:12px}.ph h2{margin:2px 0 0;font-size:clamp(20px,4vw,28px)}
.pb{padding:14px 16px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}
.tb .sp{margin-left:auto}
.pill{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:20px;overflow:hidden}
.pill button{border:0;background:#fff;padding:6px 10px;cursor:pointer;color:var(--n)}.pill span{padding:0 6px;font-size:12px}
.rel{position:relative}
.pop{position:absolute;top:calc(100% + 9px);left:0;background:#fff;border:1px solid var(--bd);border-radius:6px;box-shadow:0 6px 18px #0003;padding:10px;z-index:15;min-width:250px;max-height:320px;overflow:auto;display:none}
.pop.show{display:block}.pop:before{content:'';position:absolute;top:-6px;left:22px;width:10px;height:10px;background:#fff;border-left:1px solid var(--bd);border-top:1px solid var(--bd);transform:rotate(45deg)}
.pop label,.ml label{display:flex;gap:8px;padding:4px 2px;font-size:13px;align-items:center}
select,input[type=text],input[type=date],input[type=number],textarea{border:1px solid var(--bd);border-radius:4px;padding:7px 9px;font:inherit;background:#fff;color:var(--n);max-width:100%}
.tw{overflow:auto;max-height:65vh}
table{border-collapse:collapse;width:max-content;min-width:100%}
th{position:sticky;top:0;background:var(--n);color:#fff;padding:8px 10px;text-align:left;font-size:12px;white-space:nowrap;cursor:pointer;z-index:2}
th i{font-size:9px;opacity:.6;margin-left:4px}
td{padding:7px 10px;border-bottom:1px solid #e2e8f0;font-size:13px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:nth-child(even) td{background:#f8fafc}td:focus{outline:2px solid var(--g);background:#fff}
.ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;font-size:13px}
.pg button{border:1px solid var(--bd);background:#fff;padding:5px 10px;margin:0 2px;border-radius:4px;cursor:pointer;color:var(--n)}.pg button.on{background:var(--n);color:#fff}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.show{display:flex}.md{background:#fff;border-radius:8px;width:420px;max-width:100%;max-height:85vh;display:flex;flex-direction:column}
.md .ml{overflow:auto;padding:10px 16px}.md h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--bd)}.md .mf{padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.fl b{font-size:12px;color:var(--g)}
.cv{max-width:720px;height:320px}
.sec{background:var(--n);color:#fff;padding:8px 14px;font-weight:700;font-family:Merriweather,serif;font-size:14px}
.row{padding:10px 16px;border-bottom:1px solid #e2e8f0;display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:8px;align-items:start}
.row>label{font-weight:600;font-size:13px}.o{display:inline-flex;gap:5px;margin:2px 14px 2px 0;align-items:center;font-weight:400}
.row input[type=text],.row input[type=date],.row textarea{width:100%}.ro{background:#f8fafc;padding:7px 9px;border:1px dashed var(--bd);border-radius:4px;min-height:34px}
.empty{padding:30px;text-align:center;color:#64748b}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:6px;display:none;z-index:60}
.view{display:none}.view.on{display:block}
@media(max-width:700px){.nc{width:calc(33.3% - 10px);min-width:100px;height:78px}.cards{gap:10px;flex:1 1 100%}.acts{flex-direction:row;flex:1 1 100%}.acts .btn{flex:1}.row{grid-template-columns:1fr}.tb .sp{margin-left:0}}
@media print{header,.tb,.ft{display:none}}
</style></head><body>
<header><div class="w">
<div class="top"><h1>FTTH Verification</h1><button class="sq" id="fs" title="Full screen"><i class="fa-solid fa-expand"></i></button></div>
<div class="bar">
<div class="cards" id="cards"></div>
<div class="acts"><button class="btn p" id="ins">Insert DB</button><button class="btn" id="dl" disabled>Download DB</button><input type="file" id="file" accept=".xlsx,.xls" hidden></div>
</div></div></header>
<main>
<section class="view" id="v-dash"></section>
<section class="view" id="v-db"></section>
<section class="view" id="v-visits"></section>
<section class="view" id="v-pro"></section>
<section class="view" id="v-set"></section>
</main>
<div class="ov" id="ov"><div class="md"><h3>Print / Save – choose columns</h3><div class="ml" id="ml"></div>
<div class="mf"><button class="btn sm" id="mall">Select all</button><button class="btn sm" id="mx">Cancel</button><button class="btn p sm" id="mok">Download .xlsx</button></div></div></div>
<div id="toast"></div>
<script>
const COLS=["S.No.","Name of the State/UT","Circle name","District name","Block name","Block code","GP name","GP code","Village name","Village code","Village poulation range","Name of BNU","BNU Mobile number","BNU unique id","OLT IP from which ONT of the customer connected","Name of the customer","Customer unique id","Type of Customer (Publicinstitution/PrivateEnterprise/Household)","Customer address","ONT MAC address","Latitude of FTTH connection","Longitude of FTTH connection","Date of activation of connection","Current FTTH connection status (Active/Permanently closed)","If active Connection age at the last day of reporting quarter","Data usage of the Customer (GB)","Permanently closed, then Date of permanently closed"];
const FMAP={"State/UT":"Name of the State/UT","Circle":"Circle name","District":"District name","Block":"Block name","Gram Panchayat":"GP name","Village":"Village name"};
const PAGES=[['dash','Dashboard','fa-gauge-high'],['db','Edit/DB','fa-database'],['visits','My Visits','fa-chart-simple'],['pro','Proforma','fa-file-lines'],['set','Settings','fa-gear']];
const TITLES={dash:'Dashboard',db:'Edit / DB',visits:'My Visits',pro:'Proforma',set:'Settings'};
const SUB={dash:'Overview',db:'Edit database',visits:'Completed surveys',pro:'Survey form A–N',set:'Preferences'};
let DB=[],VIS={},cur='db',chart=null,cp=null;
let S={page:1,rows:25,col:null,dir:1,zoom:100,list:'Unvisited',hidden:new Set(),fby:'State/UT',fval:'All',cfg:{bnu:'',off:'',des:''}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)};
const vis=r=>!!VIS[r[COLS[0]]];
/* storage */
const idb=()=>new Promise(r=>{const q=indexedDB.open('ftth',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
async function save(){try{const d=await idb();d&&d.transaction('k','readwrite').objectStore('k').put({DB,VIS,cfg:S.cfg,rows:S.rows},'s')}catch(e){}}
async function load(){try{const d=await idb();if(!d)return;const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>{const v=q.result;if(v){DB=v.DB||[];VIS=v.VIS||{};S.cfg=v.cfg||S.cfg;S.rows=v.rows||25;}go(cur)}}catch(e){}}
/* nav */
$('cards').innerHTML=PAGES.map(p=>`<button class="nc" data-p="${p[0]}"><i class="fa-solid ${p[2]}"></i><span>${p[1].toUpperCase()}</span></button>`).join('');
$('cards').onclick=e=>{const b=e.target.closest('.nc');b&&go(b.dataset.p)};
function head(){return `<div class="ph"><small>FTTH VERIFICATION</small><h2>${TITLES[cur]}</h2></div>`}
function go(p){cur=p;document.querySelectorAll('.nc').forEach(b=>b.classList.toggle('on',b.dataset.p==p));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id=='v-'+p));
({dash:rDash,db:rDB,visits:rVisits,pro:rPro,set:rSet})[p]();$('dl').disabled=!DB.length}
/* file in / out */
$('ins').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer());
DB=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});DB.forEach((r,i)=>{if(r[COLS[0]]===''||r[COLS[0]]==null)r[COLS[0]]=i+1});
VIS={};const ps=wb.Sheets['Proforma'];if(ps)XLSX.utils.sheet_to_json(ps,{defval:''}).forEach(r=>{try{VIS[r['S.No.']]={t:r['Visit Date'],d:JSON.parse(r['Data'])}}catch(x){}});
S.page=1;await save();go(cur);toast(DB.length+' records loaded')}catch(x){toast('Could not read file')}e.target.value=''};
function dlFull(){if(!DB.length)return;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB,{header:COLS}),'Database');
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(VIS).map(([k,v])=>({'S.No.':k,'Visit Date':v.t,'Data':JSON.stringify(v.d)}))),'Proforma');XLSX.writeFile(wb,'FTTH_DB_'+new Date().toISOString().slice(0,10)+'.xlsx')}
$('dl').onclick=dlFull;
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
/* dashboard */
function uniq(c){return [...new Set(DB.map(r=>r[c]).filter(x=>x!==''))].sort()}
function rDash(){const col=FMAP[S.fby],rs=S.fval=='All'?DB:DB.filter(r=>r[col]==S.fval),v=rs.filter(vis).length;
$('v-dash').innerHTML=`<div class="pn">${head()}<div class="pb"><div class="fl"><b>FILTER BY</b><select id="fb">${Object.keys(FMAP).map(k=>`<option ${k==S.fby?'selected':''}>${k}</option>`).join('')}</select>
<b>SELECT ${S.fby.toUpperCase()}</b><select id="fv"><option>All</option>${uniq(col).map(x=>`<option ${x==S.fval?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
<div class="cv" style="margin-top:16px"><canvas id="ch"></canvas></div></div></div>`;
$('fb').onchange=e=>{S.fby=e.target.value;S.fval='All';rDash()};$('fv').onchange=e=>{S.fval=e.target.value;rDash()};
chart&&chart.destroy();chart=new Chart($('ch'),{type:'bar',data:{labels:['Total Records','Visited','Pending'],datasets:[{data:[rs.length,v,rs.length-v],backgroundColor:['#1a2b45','#2f855a','#8b734b']}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}
/* edit db */
function list(){let a=DB.map((r,i)=>i);if(S.list=='Unvisited')a=a.filter(i=>!vis(DB[i]));else if(S.list=='Visited')a=a.filter(i=>vis(DB[i]));
if(S.col!=null)a.sort((x,y)=>S.dir*String(DB[x][S.col]).localeCompare(String(DB[y][S.col]),undefined,{numeric:true}));return a}
function rDB(){const L=list(),tp=Math.max(1,Math.ceil(L.length/S.rows));S.page=Math.min(S.page,tp);const st=(S.page-1)*S.rows,pg=L.slice(st,st+S.rows),vc=COLS.filter(c=>!S.hidden.has(c));
let pb='';for(let p=Math.max(1,S.page-2);p<=Math.min(tp,Math.max(1,S.page-2)+4);p++)pb+=`<button class="${p==S.page?'on':''}" data-pg="${p}">${p}</button>`;
$('v-db').innerHTML=`<div class="pn">${head()}
<div class="tb"><button class="btn sm" id="upd"><i class="fa-solid fa-rotate"></i> Update DB</button>
<div class="rel"><button class="btn sm" id="cb"><i class="fa-solid fa-table-columns"></i> Columns</button><div class="pop" id="pop">${COLS.map(c=>`<label><input type="checkbox" data-c="${esc(c)}" ${S.hidden.has(c)?'':'checked'}>${esc(c)}</label>`).join('')}</div></div>
<div class="pill"><button id="zm">−</button><span>${S.zoom}%</span><button id="zp">+</button></div>
<div class="rel pill" style="border-radius:4px"><button id="ps" class="sm"><i class="fa-solid fa-print"></i> Print/Save</button><button id="pc" style="border-left:1px solid var(--bd)"><i class="fa-solid fa-caret-down"></i></button>
<div class="pop" id="pp" style="min-width:190px"><label style="cursor:pointer" id="pp1"><i class="fa-solid fa-file-excel"></i> Export selected columns</label><label style="cursor:pointer" id="pp2"><i class="fa-solid fa-print"></i> Print page</label></div></div>
<button class="btn sm" id="fsb"><i class="fa-solid fa-expand"></i> Full Screen</button><button class="btn sm" id="fxb"><i class="fa-solid fa-compress"></i> Exit</button>
<select class="sp" id="lt">${['Unvisited','Visited','All'].map(x=>`<option ${x==S.list?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="ph" style="padding:10px 16px"><b><i class="fa-solid fa-database"></i> EDIT DATABASE</b></div>
<div class="tw">${DB.length?`<table style="font-size:${S.zoom}%;zoom:${S.zoom}%"><thead><tr><th>Action</th>${vc.map(c=>`<th data-s="${esc(c)}">${esc(c)}<i class="fa-solid fa-sort"></i></th>`).join('')}</tr></thead>
<tbody>${pg.map(i=>`<tr><td><button class="btn sm" data-f="${i}">${vis(DB[i])?'Edit':'Survey'}</button></td>${vc.map(c=>`<td contenteditable data-i="${i}" data-k="${esc(c)}">${esc(DB[i][c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty"><i class="fa-solid fa-file-excel" style="font-size:34px"></i><p>No database loaded. Click <b>INSERT DB</b> to upload an .xlsx file.</p></div>'}</div>
<div class="ft"><span>Showing ${L.length?st+1:0} to ${st+pg.length} of ${L.length} records</span><div class="pg"><button data-pg="${S.page-1}">Prev</button>${pb}<button data-pg="${S.page+1}">Next</button></div>
<span>Rows per page <select id="rp">${[10,25,50,100].map(x=>`<option ${x==S.rows?'selected':''}>${x}</option>`).join('')}</select></span></div></div>`;
const V=$('v-db');
$('upd').onclick=async()=>{await save();rDB();toast('Database updated in browser memory')};
$('cb').onclick=e=>{e.stopPropagation();$('pp').classList.remove('show');$('pop').classList.toggle('show')};
$('pc').onclick=e=>{e.stopPropagation();$('pop').classList.remove('show');$('pp').classList.toggle('show')};
$('pop').onclick=e=>e.stopPropagation();
$('pop').onchange=e=>{const c=e.target.dataset.c;e.target.checked?S.hidden.delete(c):S.hidden.add(c);rDB();$('pop').classList.add('show')};
$('zm').onclick=()=>{S.zoom=Math.max(50,S.zoom-10);rDB()};$('zp').onclick=()=>{S.zoom=Math.min(150,S.zoom+10);rDB()};
$('ps').onclick=$('pp1').onclick=openM;$('pp2').onclick=()=>print();
$('fsb').onclick=()=>document.documentElement.requestFullscreen?.();$('fxb').onclick=()=>document.fullscreenElement&&document.exitFullscreen();
$('lt').onchange=e=>{S.list=e.target.value;S.page=1;rDB()};$('rp').onchange=e=>{S.rows=+e.target.value;S.page=1;save();rDB()};
V.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const p=+b.dataset.pg;if(p>=1&&p<=tp){S.page=p;rDB()}});
V.querySelectorAll('[data-s]').forEach(h=>h.onclick=()=>{const c=h.dataset.s;S.dir=S.col==c?-S.dir:1;S.col=c;rDB()});
V.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cp=+b.dataset.f;go('pro')});
V.querySelectorAll('td[contenteditable]').forEach(t=>t.onblur=()=>{const v=t.textContent;if(DB[t.dataset.i][t.dataset.k]!=v){DB[t.dataset.i][t.dataset.k]=v;save()}})}
document.addEventListener('click',()=>document.querySelectorAll('.pop').forEach(p=>p.classList.remove('show')));
/* print modal */
function openM(){$('ml').innerHTML=COLS.map(c=>`<label><input type="checkbox" value="${esc(c)}" checked>${esc(c)}</label>`).join('');$('ov').classList.add('show')}
$('mx').onclick=()=>$('ov').classList.remove('show');
$('mall').onclick=()=>{const bs=$('ml').querySelectorAll('input'),a=[...bs].every(b=>b.checked);bs.forEach(b=>b.checked=!a)};
$('mok').onclick=()=>{const cs=[...$('ml').querySelectorAll('input:checked')].map(b=>b.value);if(!cs.length||!DB.length)return toast('Nothing to export');
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.map(r=>Object.fromEntries(cs.map(c=>[c,r[c]]))),{header:cs}),'Export');XLSX.writeFile(wb,'FTTH_Export.xlsx');$('ov').classList.remove('show')};
/* visits */
function rVisits(){const rs=DB.filter(vis);$('v-visits').innerHTML=`<div class="pn">${head()}<div class="pb">Completed surveys: <b>${rs.length}</b> of ${DB.length}</div><div class="tw">${rs.length?`<table><thead><tr><th>S.No.</th><th>Customer</th><th>Village</th><th>Visit Date</th><th>Overall Impact</th><th></th></tr></thead><tbody>${rs.map(r=>{const v=VIS[r[COLS[0]]];return `<tr><td>${esc(r[COLS[0]])}</td><td>${esc(r["Name of the customer"])}</td><td>${esc(r["Village name"])}</td><td>${esc(v.t)}</td><td>${esc(v.d['Overall impact']||'')}</td><td><button class="btn sm" data-e="${DB.indexOf(r)}">Edit</button> <button class="btn sm" data-u="${r[COLS[0]]}">Unmark</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No visits recorded yet.</div>'}</div></div>`;
$('v-visits').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{cp=+b.dataset.e;go('pro')});
$('v-visits').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{delete VIS[b.dataset.u];save();rVisits()})}
/* proforma */
const YN='Yes|No',RON='Regularly|Occasionally|Never',IDN='Increased|Decreased|No Change',IMP5='Significantly improved|Moderately improved|Slightly improved|No Change|Worsened';
const SEC=[
['C. Connection Details (editable)',[['Connection request date','d'],['BNU FTTH plan name','t'],['Plan speed (Mbps)  – TRAI test: myspeed.trai.gov.in','t'],['Connection activation status','r','Active|Inactive/Permanently Closed|Suspended'],['Connection currently in use','r',YN],['FTTH performance and service satisfactory','r',YN],['Customer contact number','t']]],
['D. Physical Verification',[['Customer/authorised person present','r',YN],['Proof of identity verified','r','Aadhaar|Voter ID|Office ID|Not Available'],['Address matches records','r',YN],['Equipment installed (ONT/Router/CPE)','r',YN],['Serial number / Asset ID','t']]],
['E. Usage & Service Validation',[['Approximate monthly usage','r','Low (<10 GB)|Medium (10–25 GB)|High (>25 GB)']]],
['F. Authenticity Assessment',[['Signs of irregularity (duplicate/fake/non-existent)','r',YN],['If yes, specify details','t']]],
['G. Economic Outcomes & Expenses',[['Change in household income','r',IDN],['Internet-based income sources','c','E-commerce|Online job|Freelancing/Gig work|Digital payments received|Remittances|Other'],['Started new online business/freelance work','r',YN],['Reduced household expenses due to FTTH','r',YN],['Change in monthly travel due to online services','r',IDN],['Use of e-commerce platforms','r',RON]]],
['H. Education & Digital Skills',[['Digital skills level','r','Beginner|Basic|Intermediate|Advanced'],['Family members using online education','t'],['Impact on education','r','Improved|No Change|Worsened|N/A'],['Online learning/skill development','c','Online classes|Competitive exams|Vocational skills|Other']]],
['I. Healthcare & E-Governance',[['Teleconsultations in last 12 months','t'],['Online health services/medicine orders','r',RON],['Government e-services usage','r',RON],['Services used','c','Aadhaar/PAN|Certificates|Land records|Pension/Welfare|Digital payments|Other']]],
['J. Agricultural Impact (if applicable)',[['Household engaged in agriculture','r',YN],['FTTH benefit to farming','r','Significant|Moderate|No Change|N/A'],['Farming benefits','c','Market prices|Weather|Soil/Crop advice|Fertilizer information|Government schemes/subsidies']]],
['K. Digital Inclusion & Quality of Life',[['Entertainment','r',IMP5],['Communication with family/friends','r','Improved significantly|Improved moderately|Improved slightly|No Change'],['Family members newly using internet (number, 0 = none)','t'],['Women newly using internet (number, 0 = none)','t'],['Senior citizens using internet','r',YN],['Major benefits of FTTH','c','Education|Income/Employment|Business|Healthcare|Time/Cost savings|Digital payments|Entertainment|Social connectivity']]],

function rPro(){const o=DB.map((r,i)=>`<option value="${i}" ${i==cp?'selected':''}>${esc(r[COLS[0]])} – ${esc(r["Name of the customer"])}</option>`).join('');
let h=`<div class="pn">${head()}<div class="pb fl"><b>CUSTOMER</b><select id="cs"><option value="">Select customer…</option>${o}</select></div></div>`;
if(cp==null||!DB[cp]){$('v-pro').innerHTML=h+`<div class="pn"><div class="empty">${DB.length?'Select a customer above (or press Survey in Edit/DB).':'Insert a database first.'}</div></div>`;}
else{const r=DB[cp],sv=VIS[r[COLS[0]]]?.d||{},A=(l,k)=>`<div class="row"><label>${l}</label><div class="ro">${esc(r[k])}</div></div>`;
const dflt={'Name of BNU':S.cfg.bnu||r['Name of BNU'],'Name of verifying officer':S.cfg.off,'Designation':S.cfg.des,'Connection activation status':/closed/i.test(r[COLS[23]])?'Inactive/Permanently Closed':'Active','Date of verification':new Date().toISOString().slice(0,10)};
let n=0;
h+=`<div class="pn"><div class="sec">A. Location & Administrative Details</div>${A('District Name','District name')+A('Block Name','Block name')+A('Gram Panchayat (GP) Name','GP name')+A('Village Name','Village name')+A('Customer Unique ID','Customer unique id')+A('Village Population Range','Village poulation range')}
<div class="sec">B. Customer Details</div>${A('Customer Name','Name of the customer')+A('Customer Address','Customer address')+A('Customer Type',COLS[17])}
<div class="sec">C. Connection (from records)</div>${A('Date of Connection Activation',COLS[22])}
<form id="pf">${SEC.map(([t,fs])=>`<div class="sec">${t}</div>`+fs.map(([l,ty,op])=>{const v=sv[l]??dflt[l]??'',k=esc(l);let c;
if(ty=='r'){n++;c=op.split('|').map(x=>`<label class="o"><input type="radio" name="r${n}" value="${esc(x)}" ${v==x?'checked':''}>${esc(x)}</label>`).join('')}
else if(ty=='c')c=op.split('|').map(x=>`<label class="o"><input type="checkbox" value="${esc(x)}" ${String(v).split(', ').includes(x)?'checked':''}>${esc(x)}</label>`).join('');
else if(ty=='a')c=`<textarea rows="3">${esc(v)}</textarea>`;else c=`<input type="${ty=='d'?'date':'text'}" value="${esc(v)}">`;
return `<div class="row"><label>${k}</label><div class="f" data-k="${k}" data-t="${ty}">${c}</div></div>`}).join('')).join('')}
<div class="pb"><button type="submit" class="btn p">Save &amp; mark visited</button> <button type="button" class="btn" id="pcl">Clear</button></div></form></div>`;
$('v-pro').innerHTML=h;
$('pf').onsubmit=e=>{e.preventDefault();const d={};document.querySelectorAll('#pf .f').forEach(f=>{const t=f.dataset.t;d[f.dataset.k]=t=='r'?(f.querySelector(':checked')?.value||''):t=='c'?[...f.querySelectorAll(':checked')].map(x=>x.value).join(', '):f.querySelector('input,textarea').value});
VIS[r[COLS[0]]]={t:d['Date of verification'],d};save();toast('Survey saved – marked visited');$('dl').disabled=false};
$('pcl').onclick=()=>{delete VIS[r[COLS[0]]];save();rPro()}}
const cs=$('cs');cs.onchange=e=>{cp=e.target.value===''?null:+e.target.value;rPro()}}
/* settings */
function rSet(){$('v-set').innerHTML=`<div class="pn">${head()}<div class="pb"><div class="row"><label>Default BNU name</label><input type="text" id="s1" value="${esc(S.cfg.bnu)}"></div>
<div class="row"><label>Verifying officer</label><input type="text" id="s2" value="${esc(S.cfg.off)}"></div><div class="row"><label>Designation</label><input type="text" id="s3" value="${esc(S.cfg.des)}"></div>
<div class="row"><label>Rows per page</label><select id="s4">${[10,25,50,100].map(x=>`<option ${x==S.rows?'selected':''}>${x}</option>`).join('')}</select></div>
<div style="padding:10px 16px"><button class="btn p" id="ssv">Save settings</button> <button class="btn" id="sclr">Clear browser data</button></div>
<p style="padding:0 16px;color:#64748b">Data lives in this browser only. Use <b>Download DB</b> to save an updated Excel file.</p></div></div>`;
$('ssv').onclick=()=>{S.cfg={bnu:$('s1').value,off:$('s2').value,des:$('s3').value};S.rows=+$('s4').value;save();toast('Settings saved')};
$('sclr').onclick=async()=>{if(!confirm('Clear all data stored in this browser? Download first if needed.'))return;DB=[];VIS={};cp=null;await save();go('db')}}
load();go('db');
</script></body></html>
